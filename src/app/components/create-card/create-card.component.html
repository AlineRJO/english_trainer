<div class="container my-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card p-4 shadow-sm border-0 create-card-container">
        <h2 class="h4 mb-3 text-center">Criar Novo Card</h2>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
          <!-- Campo Título / Instrução -->
          <div class="mb-3">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Título / Instrução</mat-label>
              <input
                matInput
                id="card-title-input"
                formControlName="title"
                placeholder="Ex: Explain this..."
                maxlength="100"
              />
              <mat-error *ngIf="form.get('title')?.hasError('required')">
                Campo obrigatório
              </mat-error>
              <mat-error *ngIf="form.get('title')?.hasError('maxlength')">
                Máximo de 100 caracteres
              </mat-error>
            </mat-form-field>
          </div>

          <!-- Campo Texto Auxiliar 1 -->
          <div class="mb-3">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Texto Auxiliar</mat-label>
              <input
                matInput
                id="card-auxiliary-text-input"
                formControlName="auxiliaryText"
                placeholder="Ex: give a tip"
                maxlength="300"
              />
              <mat-error *ngIf="form.get('auxiliaryText')?.hasError('maxlength')">
                Máximo de 300 caracteres
              </mat-error>
            </mat-form-field>
          </div>

          <!-- Campo Texto Auxiliar 2 -->
          <div class="mb-3">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Texto Auxiliar 2</mat-label>
              <input
                matInput
                id="card-auxiliary2-text-input"
                formControlName="auxiliaryText2"
                placeholder="Ex: give a tip"
                maxlength="300"
              />
              <mat-error *ngIf="form.get('auxiliaryText2')?.hasError('maxlength')">
                Máximo de 300 caracteres
              </mat-error>
            </mat-form-field>
          </div>

          <h3>Card de resposta</h3>
          <!-- Campo titulo resposta -->
          <div class="mb-3">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Título</mat-label>
              <input
                matInput
                id="card-title-input"
                formControlName="titleAnswer"
                placeholder="Ex: Explain this..."
                maxlength="100"
              />
              <mat-error *ngIf="form.get('title')?.hasError('required')">
                Campo obrigatório
              </mat-error>
              <mat-error *ngIf="form.get('title')?.hasError('maxlength')">
                Máximo de 100 caracteres
              </mat-error>
            </mat-form-field>
          </div>

          <!-- Campo Texto Auxiliar 1 resposta -->
          <div class="mb-3">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Texto Auxiliar</mat-label>
              <input
                matInput
                id="card-auxiliary-answer-input"
                formControlName="auxiliaryTextAnswer"
                placeholder="Ex: give a tip"
                maxlength="300"
              />
              <mat-error *ngIf="form.get('auxiliaryText')?.hasError('maxlength')">
                Máximo de 300 caracteres
              </mat-error>
            </mat-form-field>
          </div>

          <!-- Ações do Formulário -->
          <div class="d-flex justify-content-between mt-4">
            <button mat-stroked-button type="button" (click)="goBack()">
              Voltar
            </button>

            <button
            mat-raised-button
            matButton="filled"
            color="primary"
            type="submit"
            [disabled]="isSaving"
          >
            {{ isSaving ? 'Salvando...' : 'Salvar' }}
          </button>
         
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
